[project]
name = "ariel"
version = "0.1.0"
description = "Voice-first computer use agent for Windows"
readme = "README.md"
authors = [
    { name = "Dawar13", email = "dawar.iitb@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "mcp>=2.2.0",
    "pydantic>=2.13.5",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "desktop: acts on the real desktop, microphone, speakers or GPU; run with -m desktop",
]
addopts = ["--strict-markers", "-m", "not desktop"]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
